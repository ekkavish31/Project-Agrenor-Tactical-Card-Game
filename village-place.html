 forge:{name:'โรงตีเหล็ก',sub:'หลอม ตี ชุบ ที่จุดทำงานแต่ละจุด',floor:{w:7,d:6,tex:'soil',walls:true},exit:{u:0,v:5.6},

const copy=x=>JSON.parse(JSON.stringify(x)),HERO_SCALE=(()=>{try{return+JSON.parse(localStorage.getItem('project-a-village-editor-v67')||'{}').assets?.chars?.hero||1}catch(e){return 1}})();
function loadAll(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return{}}}

/* ---------- geometry ---------- */
const S=45,project=(u,v,z=0)=>({x:1100+(u-v)*S,y:700+(u+v)*S/2-z}),inv=(x,y)=>({u:((x-1100)/S+(y-700)/(S/2))/2,v:((y-700)/(S/2)-(x-1100)/S)/2});
const hero={u:0,v:0,dir:'NE'};let W=0,H=0,scale=1,zoom=1,pan={x:0,y:0},path=[],target=null,last=0,active=true,dirty=true,state=null,editing=Q.get('edit')==='1',sel=null,work=null,undo=[];
const door=s=>({u:s.u+s.door.du,v:s.v+s.door.dv});
function blocked(u,v){const F=M.floor;return u<-F.w+.4||u>F.w-.4||v<-F.d+.4||v>F.d+1.2||M.stations.some(s=>Math.abs(u-s.u)<s.w+.25&&Math.abs(v-s.v)<s.d+.25)}
const key=p=>Math.round(p.u*2)+','+Math.round(p.v*2);
function clear(a,b){for(let i=0;i<=8;i++){const f=i/8;if(blocked(a.u+(b.u-a.u)*f,a.v+(b.v-a.v)*f))return false}return true}
function route(from,to){const end={u:Math.round(to.u*2)/2,v:Math.round(to.v*2)/2},start={u:Math.round(from.u*2)/2,v:Math.round(from.v*2)/2};if(blocked(end.u,end.v))return[];const open=[start],cost=new Map([[key(start),0]]),prev=new Map(),closed=new Set();let found=null;
 while(open.length){open.sort((a,b)=>(cost.get(key(a))+Math.hypot(a.u-end.u,a.v-end.v))-(cost.get(key(b))+Math.hypot(b.u-end.u,b.v-end.v)));const a=open.shift(),ak=key(a);if(closed.has(ak))continue;closed.add(ak);if(ak===key(end)){found=a;break}if(closed.size>4000)break;
  for(const[du,dv]of[[.5,0],[-.5,0],[0,.5],[0,-.5],[.5,.5],[.5,-.5],[-.5,.5],[-.5,-.5]]){const b={u:a.u+du,v:a.v+dv},bk=key(b),n=cost.get(ak)+Math.hypot(du,dv);if(closed.has(bk)||blocked(b.u,b.v)||!clear(a,b)||n>=(cost.get(bk)??Infinity))continue;cost.set(bk,n);prev.set(bk,a);open.push(b)}}
 if(!found)return[];const out=[found];while(key(found)!==key(start)){found=prev.get(key(found));out.unshift(found)}return out}

/* ---------- art: real images or code-drawn placeholders ---------- */
const ART_LIST=[['code:furnace','เตาหลอม (โค้ด)'],['code:anvil','ทั่ง (โค้ด)'],['code:tub','ถังชุบ (โค้ด)'],['code:board','แท่นสมุด (โค้ด)'],['code:table','โต๊ะ (โค้ด)'],['code:bed','เตียง (โค้ด)'],['code:chest','หีบ (โค้ด)'],['code:hearth','เตาผิง (โค้ด)'],['code:crate','ลังไม้ (โค้ด)'],['code:lamp','โคมไฟ (โค้ด)'],['code:shelf','ชั้นวาง (โค้ด)'],
 ['vt:market-materials.png','ร้านวัตถุดิบ'],['vt:market-equipment.png','ร้านรับซื้อ'],['vt:market-orders.png','กระดานออร์เดอร์'],['vt:forge.png','โรงตีเหล็ก (อาคาร)'],['vt:fountain.png','น้ำพุ'],
 ...['bench','woodpile','hay','cart','well','signpost','banner-pole','flower-box','flower-bed','market-stall-red','market-stall-blue','stepping-stones','pond-lilies','fence-picket','stone-wall-low','hedge-row'].map(n=>['decor:'+n,n])];
const imgOf=a=>a.startsWith('vt:')?TownArt.image('assets/village-town/'+a.slice(3)):a.startsWith('decor:')?TownArt.image('assets/village-town/decor/'+a.slice(6)+'.png'):a.startsWith('img:')?TownArt.image(a.slice(4)):null;
function box(u,v,w,d,h,top,left,right){const P=(a,b,z)=>project(u+a,v+b,z),poly=(pts,c)=>{g.beginPath();pts.forEach((p,i)=>g[i?'lineTo':'moveTo'](p.x,p.y));g.closePath();g.fillStyle=c;g.fill();g.strokeStyle='#0003';g.lineWidth=1;g.stroke()};
 poly([P(-w,d,0),P(w,d,0),P(w,d,h),P(-w,d,h)],left);poly([P(w,-d,0),P(w,d,0),P(w,d,h),P(w,-d,h)],right);poly([P(-w,-d,h),P(w,-d,h),P(w,d,h),P(-w,d,h)],top)}
function codeArt(kind,u,v,s,t){const k=s;switch(kind){
 case'furnace':{box(u,v,1.2*k,1.2*k,80*k,'#8b7f73','#6e645a','#5a5249');box(u-.4*k,v-.4*k,.35*k,.35*k,150*k,'#6a6058','#544b44','#463f39');const m=project(u,v+1.2*k,28*k),f=.75+.25*Math.sin(t/120);g.fillStyle=`rgba(255,${120+60*f|0},40,.95)`;g.beginPath();g.ellipse(m.x,m.y,20*k,14*k,0,0,7);g.fill();const gl=g.createRadialGradient(m.x,m.y,0,m.x,m.y,90*k);gl.addColorStop(0,`rgba(255,150,60,${.35*f})`);gl.addColorStop(1,'rgba(255,150,60,0)');g.fillStyle=gl;g.beginPath();g.arc(m.x,m.y,90*k,0,7);g.fill();break}
 case'anvil':box(u,v,.45*k,.45*k,26*k,'#7a5434','#5f412a','#4d3522');box(u,v,.7*k,.35*k,40*k,'#4b4f55','#35383d','#2a2d31');break;
 case'tub':{const c=project(u,v,0),r=40*k;g.fillStyle='#6b4a2e';g.beginPath();g.ellipse(c.x,c.y,r,r*.5,0,0,Math.PI);g.lineTo(c.x-r,c.y-34*k);g.ellipse(c.x,c.y-34*k,r,r*.5,0,Math.PI,0,true);g.closePath();g.fill();g.fillStyle='#3e7fa8';g.beginPath();g.ellipse(c.x,c.y-34*k,r*.86,r*.42,0,0,7);g.fill();g.strokeStyle='#3b2a19';g.lineWidth=3;g.beginPath();g.ellipse(c.x,c.y-14*k,r,r*.5,0,0,Math.PI);g.stroke();break}
 case'board':box(u,v,.12*k,.12*k,60*k,'#7a5434','#5f412a','#4d3522');{const p=project(u,v,60*k);g.fillStyle='#e8dcc0';g.strokeStyle='#6b4a2e';g.lineWidth=3;g.beginPath();g.rect(p.x-26*k,p.y-30*k,52*k,34*k);g.fill();g.stroke();g.fillStyle='#8a6a44';for(let i=0;i<3;i++)g.fillRect(p.x-18*k,p.y-22*k+i*9*k,36*k,2)}break;
 case'table':box(u,v,.85*k,.85*k,34*k,'#a0733f','#7d5730','#6a4927');break;
 case'bed':box(u,v,1.1*k,1.7*k,22*k,'#7a5434','#5f412a','#4d3522');box(u,v+.3*k,1*k,1.25*k,30*k,'#b5473b','#8f362d','#7a2e26');box(u,v-1.2*k,1*k,.35*k,34*k,'#efe6d3','#cfc4ad','#bdb29b');break;
 case'chest':box(u,v,.8*k,.5*k,34*k,'#8a5a2e','#6b4422','#58381c');box(u,v,.82*k,.52*k,26*k,'#c9a24a','#a8853a','#8f7130');box(u,v,.8*k,.5*k,22*k,'#8a5a2e','#6b4422','#58381c');break;
 case'hearth':{box(u,v,1*k,.5*k,70*k,'#9b8f80','#7d7366','#6a6157');const m=project(u,v+.5*k,22*k),f=.75+.25*Math.sin(t/140);g.fillStyle=`rgba(255,${130+70*f|0},50,.95)`;g.beginPath();g.ellipse(m.x,m.y,22*k,13*k,0,0,7);g.fill();break}
 case'crate':box(u,v,.45*k,.45*k,38*k,'#a07a48','#82603a','#6d5030');break;
 case'shelf':box(u,v,.9*k,.3*k,110*k,'#7a5434','#5f412a','#4d3522');break;
 case'lamp':{const p=project(u,v,0),f=.85+.15*Math.sin(t/250+u);g.fillStyle='#2b2a28';g.fillRect(p.x-3,p.y-110*k,6,110*k);g.fillStyle=`rgba(255,${200*f|0},110,${f})`;g.fillRect(p.x-8,p.y-128*k,16,20*k);const gl=g.createRadialGradient(p.x,p.y-118*k,0,p.x,p.y-118*k,50);gl.addColorStop(0,`rgba(255,210,120,${.3*f})`);gl.addColorStop(1,'rgba(255,210,120,0)');g.fillStyle=gl;g.beginPath();g.arc(p.x,p.y-118*k,50,0,7);g.fill();break}}}
function drawArt(a,u,v,width,s=1,flip=false,t=0,hp=null){if(a.startsWith('code:')){g.save();if(flip){const c=project(u,v);g.translate(c.x*2,0);g.scale(-1,1)}codeArt(a.slice(5),u,v,s,t);g.restore();return}
 const im=imgOf(a);if(!im?.complete||!im.naturalWidth)return;const p=project(u,v),w=width*s,h=w*im.naturalHeight/im.naturalWidth;g.save();if(flip){g.translate(p.x*2,0);g.scale(-1,1)}
 if(a.startsWith('decor:')){g.fillStyle='#00000028';g.beginPath();g.ellipse(p.x,p.y,w*.36,w*.11,0,0,7);g.fill()}TownArt.draw(g,im,null,[p.x-w/2,p.y-h*(a.startsWith('vt:')?.86:.92),w,h],hp);g.restore()}
function artRect(a,u,v,width,s=1){const p=project(u,v),w=width*s;if(a.startsWith('code:'))return{x:p.x-w/2,y:p.y-w*1.1,w,h:w*1.2};const im=imgOf(a),h=im?.naturalWidth?w*im.naturalHeight/im.naturalWidth:w;return{x:p.x-w/2,y:p.y-h*(a.startsWith('vt:')?.86:.92),w,h}}

/* ---------- floor ---------- */
const terrain=document.createElement('canvas');terrain.width=2200;terrain.height=1400;
function drawFloor(){const t=terrain.getContext('2d'),F=M.floor;t.clearRect(0,0,2200,1400);t.fillStyle=TownArt.pattern(t,'grass')||'#7d906b';t.fillRect(0,0,2200,1400);
 const pts=[[-F.w,-F.d],[F.w,-F.d],[F.w,F.d+1],[-F.w,F.d+1]].map(([u,v])=>project(u,v));t.beginPath();pts.forEach((p,i)=>t[i?'lineTo':'moveTo'](p.x,p.y));t.closePath();
 if(F.tex==='plank'){t.save();t.clip();t.fillStyle='#9a7046';t.fillRect(0,0,2200,1400);t.strokeStyle='#6f4e2e';t.lineWidth=2;for(let k=-F.w*2;k<=F.w*2+F.d*2;k++){const a=project(-F.w+k/2,-F.d),b=project(-F.w+k/2,F.d+1);t.beginPath();t.moveTo(a.x,a.y);t.lineTo(b.x,b.y);t.stroke()}for(let v=-F.d;v<F.d+1;v+=1.5)for(let u=-F.w;u<F.w;u+=3){const a=project(u+((v*7)%3),v),b=project(u+((v*7)%3),v+.5);t.strokeStyle='#5e4227';t.beginPath();t.moveTo(a.x,a.y);t.lineTo(b.x,b.y);t.stroke()}t.restore()}
 else{t.fillStyle=TownArt.pattern(t,F.tex)||'#c9bca0';t.fill()}t.strokeStyle='#4f4532';t.lineWidth=10;t.lineJoin='round';t.stroke();
