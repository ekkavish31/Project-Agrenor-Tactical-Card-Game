function route(from, to) {

   u: Math.round(to.u * 2) / 2,
   v: Math.round(to.v * 2) / 2

  start = {
   u: Math.round(from.u * 2) / 2,
   v: Math.round(from.v * 2) / 2

  cost = new Map([
   [key(start), 0]

  prev = new Map(),
  closed = new Set();

  open.sort((a, b) => (cost.get(key(a)) + Math.hypot(a.u - end.u, a.v - end.v)) - (cost.get(key(b)) + Math.hypot(b.u - end.u, b.v - end.v)));
  const a = open.shift(),
   ak = key(a);
  if (closed.has(ak)) continue;
  closed.add(ak);
  if (ak === key(end)) {
   found = a;
   break
  }
  if (closed.size > 4000) break;
  for (const [du, dv] of [
    [.5, 0],
    [-.5, 0],
    [0, .5],
    [0, -.5],
    [.5, .5],
    [.5, -.5],
    [-.5, .5],
    [-.5, -.5]
   ]) {
   const b = {
     u: a.u + du,
     v: a.v + dv
    },
    bk = key(b),
    n = cost.get(ak) + Math.hypot(du, dv);
   if (closed.has(bk) || blocked(b.u, b.v) || !clear(a, b) || n >= (cost.get(bk) ?? Infinity)) continue;
   cost.set(bk, n);
   prev.set(bk, a);
   open.push(b)
  }

 while (key(found) !== key(start)) {
  found = prev.get(key(found));
  out.unshift(found)
 }

}

 ...['bench', 'woodpile', 'hay', 'cart', 'well', 'signpost', 'banner-pole', 'flower-box', 'flower-bed', 'market-stall-red', 'market-stall-blue', 'stepping-stones', 'pond-lilies', 'fence-picket', 'stone-wall-low', 'hedge-row'].map(n => ['decor:' + n, n])
];
const imgOf = a => a.startsWith('vt:') ? TownArt.image('assets/village-town/' + a.slice(3)) : a.startsWith('decor:') ? TownArt.image('assets/village-town/decor/' + a.slice(6) + '.png') : a.startsWith('img:') ? TownArt.image(a.slice(4)) : null;

function box(u, v, w, d, h, top, left, right) {
 const P = (a, b, z) => project(u + a, v + b, z),
  poly = (pts, c) => {
   g.beginPath();
   pts.forEach((p, i) => g[i ? 'lineTo' : 'moveTo'](p.x, p.y));
   g.closePath();
   g.fillStyle = c;
   g.fill();
   g.strokeStyle = '#0003';
   g.lineWidth = 1;
   g.stroke()
  };
 poly([P(-w, d, 0), P(w, d, 0), P(w, d, h), P(-w, d, h)], left);
 poly([P(w, -d, 0), P(w, d, 0), P(w, d, h), P(w, -d, h)], right);
 poly([P(-w, -d, h), P(w, -d, h), P(w, d, h), P(-w, d, h)], top)
}

function codeArt(kind, u, v, s, t) {
 const k = s;
 switch (kind) {
  case 'furnace': {
   box(u, v, 1.2 * k, 1.2 * k, 80 * k, '#8b7f73', '#6e645a', '#5a5249');
   box(u - .4 * k, v - .4 * k, .35 * k, .35 * k, 150 * k, '#6a6058', '#544b44', '#463f39');
   const m = project(u, v + 1.2 * k, 28 * k),
    f = .75 + .25 * Math.sin(t / 120);
   g.fillStyle = `rgba(255,${120+60*f|0},40,.95)`;
   g.beginPath();
   g.ellipse(m.x, m.y, 20 * k, 14 * k, 0, 0, 7);
   g.fill();
   const gl = g.createRadialGradient(m.x, m.y, 0, m.x, m.y, 90 * k);
   gl.addColorStop(0, `rgba(255,150,60,${.35*f})`);
   gl.addColorStop(1, 'rgba(255,150,60,0)');
   g.fillStyle = gl;
   g.beginPath();
   g.arc(m.x, m.y, 90 * k, 0, 7);
   g.fill();
   break
  }
  case 'anvil':
   box(u, v, .45 * k, .45 * k, 26 * k, '#7a5434', '#5f412a', '#4d3522');
   box(u, v, .7 * k, .35 * k, 40 * k, '#4b4f55', '#35383d', '#2a2d31');
   break;
  case 'tub': {
   const c = project(u, v, 0),
    r = 40 * k;
   g.fillStyle = '#6b4a2e';
   g.beginPath();
   g.ellipse(c.x, c.y, r, r * .5, 0, 0, Math.PI);
   g.lineTo(c.x - r, c.y - 34 * k);
   g.ellipse(c.x, c.y - 34 * k, r, r * .5, 0, Math.PI, 0, true);
   g.closePath();
   g.fill();
   g.fillStyle = '#3e7fa8';
   g.beginPath();
   g.ellipse(c.x, c.y - 34 * k, r * .86, r * .42, 0, 0, 7);
   g.fill();
   g.strokeStyle = '#3b2a19';
   g.lineWidth = 3;
   g.beginPath();
   g.ellipse(c.x, c.y - 14 * k, r, r * .5, 0, 0, Math.PI);
   g.stroke();
   break
  }
  case 'board':
   box(u, v, .12 * k, .12 * k, 60 * k, '#7a5434', '#5f412a', '#4d3522');
   {
    const p = project(u, v, 60 * k);
    g.fillStyle = '#e8dcc0';
    g.strokeStyle = '#6b4a2e';
    g.lineWidth = 3;
    g.beginPath();
    g.rect(p.x - 26 * k, p.y - 30 * k, 52 * k, 34 * k);
    g.fill();
    g.stroke();
    g.fillStyle = '#8a6a44';
    for (let i = 0; i < 3; i++) g.fillRect(p.x - 18 * k, p.y - 22 * k + i * 9 * k, 36 * k, 2)
   }
   break;
  case 'table':
   box(u, v, .85 * k, .85 * k, 34 * k, '#a0733f', '#7d5730', '#6a4927');
   break;
  case 'bed':
   box(u, v, 1.1 * k, 1.7 * k, 22 * k, '#7a5434', '#5f412a', '#4d3522');
   box(u, v + .3 * k, 1 * k, 1.25 * k, 30 * k, '#b5473b', '#8f362d', '#7a2e26');
   box(u, v - 1.2 * k, 1 * k, .35 * k, 34 * k, '#efe6d3', '#cfc4ad', '#bdb29b');
   break;
  case 'chest':
   box(u, v, .8 * k, .5 * k, 34 * k, '#8a5a2e', '#6b4422', '#58381c');
   box(u, v, .82 * k, .52 * k, 26 * k, '#c9a24a', '#a8853a', '#8f7130');
   box(u, v, .8 * k, .5 * k, 22 * k, '#8a5a2e', '#6b4422', '#58381c');
   break;
  case 'hearth': {
   box(u, v, 1 * k, .5 * k, 70 * k, '#9b8f80', '#7d7366', '#6a6157');
   const m = project(u, v + .5 * k, 22 * k),
    f = .75 + .25 * Math.sin(t / 140);
   g.fillStyle = `rgba(255,${130+70*f|0},50,.95)`;
   g.beginPath();
   g.ellipse(m.x, m.y, 22 * k, 13 * k, 0, 0, 7);
   g.fill();
   break
  }
  case 'crate':
   box(u, v, .45 * k, .45 * k, 38 * k, '#a07a48', '#82603a', '#6d5030');
   break;
  case 'shelf':
   box(u, v, .9 * k, .3 * k, 110 * k, '#7a5434', '#5f412a', '#4d3522');
   break;
  case 'lamp': {
   const p = project(u, v, 0),
    f = .85 + .15 * Math.sin(t / 250 + u);
   g.fillStyle = '#2b2a28';
   g.fillRect(p.x - 3, p.y - 110 * k, 6, 110 * k);
   g.fillStyle = `rgba(255,${200*f|0},110,${f})`;
   g.fillRect(p.x - 8, p.y - 128 * k, 16, 20 * k);
   const gl = g.createRadialGradient(p.x, p.y - 118 * k, 0, p.x, p.y - 118 * k, 50);
   gl.addColorStop(0, `rgba(255,210,120,${.3*f})`);
   gl.addColorStop(1, 'rgba(255,210,120,0)');
   g.fillStyle = gl;
   g.beginPath();
   g.arc(p.x, p.y - 118 * k, 50, 0, 7);
   g.fill();
   break
  }
 }
}

function drawArt(a, u, v, width, s = 1, flip = false, t = 0, hp = null) {
 if (a.startsWith('code:')) {
  g.save();
  if (flip) {
   const c = project(u, v);
   g.translate(c.x * 2, 0);
   g.scale(-1, 1)
  }
  codeArt(a.slice(5), u, v, s, t);
  g.restore();
  return
 }
 const im = imgOf(a);
 if (!im?.complete || !im.naturalWidth) return;
 const p = project(u, v),
  w = width * s,
  h = w * im.naturalHeight / im.naturalWidth;
 g.save();
 if (flip) {
  g.translate(p.x * 2, 0);
  g.scale(-1, 1)
 }
 if (a.startsWith('decor:')) {
  g.fillStyle = '#00000028';
  g.beginPath();
  g.ellipse(p.x, p.y, w * .36, w * .11, 0, 0, 7);
  g.fill()
 }
 TownArt.draw(g, im, null, [p.x - w / 2, p.y - h * (a.startsWith('vt:') ? .86 : .92), w, h], hp);
 g.restore()
}

function artRect(a, u, v, width, s = 1) {
 const p = project(u, v),
  w = width * s;
 if (a.startsWith('code:')) return {
  x: p.x - w / 2,
  y: p.y - w * 1.1,
  w,
  h: w * 1.2
 };
 const im = imgOf(a),
  h = im?.naturalWidth ? w * im.naturalHeight / im.naturalWidth : w;
 return {
  x: p.x - w / 2,
  y: p.y - h * (a.startsWith('vt:') ? .86 : .92),
  w,
  h
 }
}

/* ---------- floor ---------- */
const terrain = document.createElement('canvas');
terrain.width = 2200;
terrain.height = 1400;

function drawFloor() {
 const t = terrain.getContext('2d'),
  F = M.floor;
 t.clearRect(0, 0, 2200, 1400);
 t.fillStyle = TownArt.pattern(t, 'grass') || '#7d906b';
 t.fillRect(0, 0, 2200, 1400);
 const pts = [
  [-F.w, -F.d],
  [F.w, -F.d],
  [F.w, F.d + 1],
  [-F.w, F.d + 1]
 ].map(([u, v]) => project(u, v));
 t.beginPath();
 pts.forEach((p, i) => t[i ? 'lineTo' : 'moveTo'](p.x, p.y));
 t.closePath();
 if (F.tex === 'plank') {
  t.save();
  t.clip();
  t.fillStyle = '#9a7046';
  t.fillRect(0, 0, 2200, 1400);
  t.strokeStyle = '#6f4e2e';
  t.lineWidth = 2;
  for (let k = -F.w * 2; k <= F.w * 2 + F.d * 2; k++) {
   const a = project(-F.w + k / 2, -F.d),
    b = project(-F.w + k / 2, F.d + 1);
   t.beginPath();
   t.moveTo(a.x, a.y);
   t.lineTo(b.x, b.y);
   t.stroke()
  }
  for (let v = -F.d; v < F.d + 1; v += 1.5)
   for (let u = -F.w; u < F.w; u += 3) {
    const a = project(u + ((v * 7) % 3), v),
     b = project(u + ((v * 7) % 3), v + .5);
    t.strokeStyle = '#5e4227';
    t.beginPath();
    t.moveTo(a.x, a.y);
    t.lineTo(b.x, b.y);
    t.stroke()
   }
  t.restore()
 } else {
  t.fillStyle = TownArt.pattern(t, F.tex) || '#c9bca0';
  t.fill()
 }
 t.strokeStyle = '#4f4532';
 t.lineWidth = 10;
 t.lineJoin = 'round';
 t.stroke();
 for (let i = 0; i < 90; i++) {
  const u = -F.w - 6 + (Math.sin(i * 72.7) * .5 + .5) * (F.w * 2 + 12),
   v = -F.d - 6 + (Math.sin(i * 16.9) * .5 + .5) * (F.d * 2 + 12);
  if (u > -F.w - 1 && u < F.w + 1 && v > -F.d - 1 && v < F.d + 2) continue;
  TownArt.detail(t, i % 5 === 0 ? 1 : 0, project(u, v), 35)
 }
}

function walls() {
 const F = M.floor;
 if (!F.walls) return;
 const h = 120,
  P = (u, v, z) => project(u, v, z),
  face = (a, b, c1) => {
   g.beginPath();
   g.moveTo(a.x, a.y);
   g.lineTo(b.x, b.y);
   g.lineTo(b.x, b.y - h);
   g.lineTo(a.x, a.y - h);
   g.closePath();
   g.fillStyle = c1;
   g.fill();
   g.strokeStyle = '#5b4330';
   g.lineWidth = 2;
   g.stroke()
  };
 const base = KIND === 'forge' ? ['#857a6c', '#73695d'] : ['#dccdb0', '#cbbb9c'];
 face(P(-F.w, -F.d), P(F.w, -F.d), base[0]);
 face(P(-F.w, F.d + 1), P(-F.w, -F.d), base[1]);
 g.strokeStyle = '#6b4a2e';
 g.lineWidth = 6;
 for (let k = -F.w; k <= F.w; k += 2.5) {
  const a = P(k, -F.d);
  g.beginPath();
  g.moveTo(a.x, a.y);
  g.lineTo(a.x, a.y - h);
  g.stroke()
 }
 for (let k = -F.d; k <= F.d + 1; k += 2.5) {
  const a = P(-F.w, k);
  g.beginPath();
  g.moveTo(a.x, a.y);
  g.lineTo(a.x, a.y - h);
  g.stroke()
 }
}

/* ---------- loop ---------- */
function resize() {
 W = innerWidth;
 H = innerHeight;
 cv.width = Math.round(W * devicePixelRatio);
 cv.height = Math.round(H * devicePixelRatio);
 fitView()
}

function fitView() {
 const F = M.floor,
  spanX = (F.w * 2 + F.d * 2 + 2) * S,
  spanY = (F.w + F.d + 1) * S + 260;
 scale = Math.min((W - 60) / spanX, (H - 200) / spanY, 1.4);
 zoom = 1;
 pan = {
  x: 0,
  y: 60
 }
}

function focus() {
 const p = project(hero.u, hero.v);
 pan = {
  x: -(p.x - 1100) * scale * zoom,
  y: H * .12 - (p.y - 700) * scale * zoom
 }
}
let hits = [];

function draw(t) {
 requestAnimationFrame(draw);
 if (!active || document.hidden) {
  last = t;
  return
 }
 const dt = Math.min(.08, (t - last) / 1000 || 0);
 last = t;
 if (!editing) window.WorldState?.tick(dt);   // v94.02: the one clock runs here too
 if (path.length && !editing) {
  const b = path[0],
   du = b.u - hero.u,
   dv = b.v - hero.v,
   n = Math.hypot(du, dv),
   step = dt * 5.5;
  if (n <= step) {
   hero.u = b.u;
   hero.v = b.v;
   path.shift();
   if (!path.length) arrive()
  } else {
   hero.u += du / n * step;
   hero.v += dv / n * step;
   const dx = du - dv,
    dy = du + dv;
   hero.dir = dy >= 0 ? (dx >= 0 ? 'SE' : 'SW') : (dx >= 0 ? 'NE' : 'NW')
  }
 }
 g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
 g.fillStyle = '#2c3d2e';
 g.fillRect(0, 0, W, H);
 g.translate(W / 2 + pan.x, H / 2 + pan.y);
 g.scale(scale * zoom, scale * zoom);
 g.translate(-1100, -700);
 if (dirty) {
  drawFloor();
  dirty = false
 }
 g.drawImage(terrain, 0, 0);
 window.PlacePaint?.draw(g);
 walls();
 if (path.length) {
  g.strokeStyle = '#e4ce8e';
  g.lineWidth = 2;
  g.setLineDash([6, 7]);
  g.beginPath();
  const p = project(hero.u, hero.v);
  g.moveTo(p.x, p.y);
  for (const b of path) {
   const q = project(b.u, b.v);
   g.lineTo(q.x, q.y)
  }
  g.stroke();
  g.setLineDash([])
 }
 const hp = project(hero.u, hero.v);
 TownArt.begin(g, hp);
 hits = [];
 const objects = [];
 M.stations.forEach((s, i) => {
  const p = project(s.u, s.v);
  hits.push({
   type: 'station',
   i,
   r: artRect(s.art, s.u, s.v, s.width || 120, s.s || 1)
  });
  objects.push({
   y: p.y,
   set: s.id,
   isStation: true,
   z: s.z || 0,
   tag: {
    type: 'station',
    i
   },
   draw: () => drawArt(s.art, s.u, s.v, s.width || 120, s.s || 1, s.f, t, hp)
  })
 });
 M.props.forEach((o, i) => {
  const p = project(o.u, o.v);
  hits.push({
   type: 'prop',
   i,
   r: artRect(o.art, o.u, o.v, o.width || 110, o.s || 1)
  });
  objects.push({
   y: p.y + (o.layer || 0),
   set: o.owner || null,
   z: o.z || 0,
   tag: {
    type: 'prop',
    i
   },
   draw: () => drawArt(o.art, o.u, o.v, o.width || 110, o.s || 1, o.f, t, hp)
  })
 });
 for (const f of fencePieces()) objects.push({ y: project(f.m.u, f.m.v).y, draw: () => drawFencePiece(f, hp) });
 objects.push({
  y: hp.y,
  draw: () => {
   g.fillStyle = '#182b2866';
   g.beginPath();
   g.ellipse(hp.x, hp.y, 13, 6, 0, 0, 7);
   g.fill();
   const hc = heroCast();
   /* v95.21: same size as on the village map (93.6 px × the village's hero scale) */ if (!window.PlaceBuild?.drawHero?.(g, hp, hero.dir, 93.6 * (hc.s || 1), hc)) TownArt.hero(g, hp, hero.dir, t, path.length > 0, 93.6 * (hc.s || 1))
  }
 });
 objects.push(...(window.PlacePeople?.objects(project, g, t, blocked, hero) || []));   // v94.02 villagers who are here now
 // v87 · a work station and its own decorations are one set (layer number, then depth); sets and loose things sort by depth
 const sets = new Map(), list = [];
 for (const o of objects) { if (o.set && M.stations.some(s => s.id === o.set)) { let G = sets.get(o.set); if (!G) sets.set(o.set, G = { m: [], y: null }); G.m.push(o); if (o.isStation) G.y = o.y } else list.push({ y: o.y, o }) }
 for (const G of sets.values()) list.push({ y: G.y ?? Math.min(...G.m.map(x => x.y)), G });
 const put = o => window.PlaceBuild ? PlaceBuild.drawObj(o) : o.draw();
 list.sort((a, b) => a.y - b.y).forEach(e => e.o ? put(e.o) : e.G.m.sort((a, b) => (a.z || 0) - (b.z || 0) || a.y - b.y).forEach(put));
 if (work && t < work.until) {
  const s = M.stations[work.i];
  if (s) {
   const p = project(s.u, s.v, 60);
   for (let k = 0; k < 6; k++) {
    const a = (t / 90 + k * 1.1) % 6.28,
     r = 20 + ((t / 7 + k * 37) % 40);
    g.fillStyle = `rgba(255,${180+k*10},90,${.8-r/70})`;
    g.beginPath();
    g.arc(p.x + Math.cos(a) * r, p.y - Math.abs(Math.sin(a)) * r, 3, 0, 7);
    g.fill()
   }
  }
 }
 // labels + doors
 for (const s of M.stations) {
  const d = door(s),
   p = project(d.u, d.v);
  g.font = '13px TownThai,system-ui';
  g.textAlign = 'center';
  const w = g.measureText(s.name).width + 22;
  g.fillStyle = '#233a2ee0';
  g.fillRect(p.x - w / 2, p.y + 14, w, 26);
  g.fillStyle = '#f6e8bd';
  g.fillText(s.name, p.x, p.y + 32)
 } {
  const p = project(M.exit.u, M.exit.v);
  g.fillStyle = '#233a2ee0';
  g.fillRect(p.x - 58, p.y + 10, 116, 26);
  g.fillStyle = '#f6e8bd';
  g.font = '13px TownThai,system-ui';
  g.textAlign = 'center';
  g.fillText('← ทางออก', p.x, p.y + 28)
 }
 window.PlaceBuild?.overlay(g, t)
}

/* ---------- play ---------- */
function actionInfo(id) {
 return state?.actions?.find(a => a.id === id)
}
/* v95.01 · story actions (js/story-quests.js, e.g. "ทำโคมไฟเทศกาล") join the station that has one of the actions in their `with` list */
function stationActs(s) {
 const own = s?.actions || [];
 const extra = (state?.actions || []).filter(a => Array.isArray(a.with) && !own.includes(a.id) && own.some(id => a.with.includes(id))).map(a => a.id);
 return [...own, ...extra]
}

function travel(i) {
 if (editing) return;
 const s = M.stations[i];
 if (!s) return;
 target = {
  i
 };
 hidePick();
 path = route(hero, door(s));
 $('status').textContent = path.length ? 'กำลังเดินไป' + s.name : (Math.hypot(hero.u - door(s).u, hero.v - door(s).v) < .8 ? 'อยู่ที่' + s.name : 'เดินไปจุดนี้ไม่ได้');
 if (!path.length && Math.hypot(hero.u - door(s).u, hero.v - door(s).v) < .8) arrive()
}

function arrive() {
 const tg = target;
 target = null;
 if (!tg) return;
 if (tg.exit) {
  send('leave');
  return
 }
 const s = M.stations[tg.i];
 if (!s) return;
 hero.dir = s.v < hero.v ? (s.u < hero.u ? 'NW' : 'NE') : (s.u < hero.u ? 'SW' : 'SE');
 const acts = stationActs(s);
 if (acts.length === 1) use(tg.i, acts[0]);
 else showPick(tg.i)
}

function use(i, id) {
 hidePick();
 const a = actionInfo(id),
  s = M.stations[i];
 if (a?.reason) {
  $('status').textContent = (a.name || ACTIONS[id]) + ' · ' + a.reason;
  return
 }
 work = {
  i,
  until: performance.now() + 1600
 };
 $('status').textContent = (s?.name || '') + ' · ' + (a?.name || ACTIONS[id]);
 send('action', {
  id
 })
}

function showPick(i) {
 const s = M.stations[i],
  box = $('pick'),
  p = project(s.u, s.v, 40),
  x = (p.x - 1100) * scale * zoom + W / 2 + pan.x,
  y = (p.y - 700) * scale * zoom + H / 2 + pan.y;
 box.innerHTML = `<h3>${s.name}</h3>` + stationActs(s).map(id => {
  const a = actionInfo(id) || {
   name: ACTIONS[id]
  };
  return `<button data-a="${id}" ${a.reason?'disabled':''}>${a.name||ACTIONS[id]}<small>${a.reason||[a.cost,a.effect].filter(Boolean).join(' · ')}</small></button>`
 }).join('') + '<button data-close>ปิด</button>';
 box.style.left = Math.max(10, Math.min(W - 240, x - 110)) + 'px';
 box.style.top = Math.max(70, Math.min(H - 260, y - 180)) + 'px';
 box.hidden = false;
 box.querySelectorAll('[data-a]').forEach(b => b.onclick = () => use(i, b.dataset.a));
 box.querySelector('[data-close]').onclick = hidePick
}

function hidePick() {
 $('pick').hidden = true
}

function shortcuts() {
 $('shortcuts').innerHTML = M.stations.map((s, i) => `<button data-i="${i}">${s.name}<small>${stationActs(s).map(id=>actionInfo(id)?.name||ACTIONS[id]).join(' · ')}</small></button>`).join('');
 $('shortcuts').querySelectorAll('[data-i]').forEach(b => b.onclick = () => travel(+b.dataset.i))
}

function world(e) {
 return {
  x: (e.clientX - W / 2 - pan.x) / (scale * zoom) + 1100,
  y: (e.clientY - H / 2 - pan.y) / (scale * zoom) + 700
 }
}

function hitAt(p) {
 for (let k = hits.length - 1; k >= 0; k--) {
  const h = hits[k],
   r = h.r;
  if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return h
 }
 return null
}
let drag = null;
cv.onpointerdown = e => {
 if (e.button !== 0) return;
 hidePick();
 drag = {
  x: e.clientX,
  y: e.clientY,
  pan: {
   ...pan
  },
  moved: false
 };
 cv.setPointerCapture(e.pointerId)
};
cv.onpointermove = e => {
 if (!drag) return;
 const dx = e.clientX - drag.x,
  dy = e.clientY - drag.y;
 if (Math.hypot(dx, dy) > 5) drag.moved = true;
 if (drag.moved) pan = {
  x: drag.pan.x + dx,
  y: drag.pan.y + dy
 }
};
cv.onpointerup = e => {
 const d = drag;
 drag = null;
 if (!d || d.moved || editing) return;
 const p = world(e),
  h = hitAt(p);
 if (window.PlacePeople?.click(p, project, {hero, go: (u, v) => { target = null; path = route(hero, {u, v}) }, stop: () => { path = [] }})) return;
 if (h?.type === 'station') {
  travel(h.i);
  return
 }
 const q = inv(p.x, p.y);
 if (Math.hypot(q.u - M.exit.u, q.v - M.exit.v) < 1.3) {
  target = {
   exit: true
  };
  path = route(hero, M.exit);
  if (!path.length) arrive();
  return
 }
 target = null;
 path = blocked(q.u, q.v) ? [] : route(hero, q);
 $('status').textContent = path.length ? 'กำลังเดิน…' : 'เดินไปจุดนี้ไม่ได้'
};
cv.onpointercancel = () => drag = null;
cv.onwheel = e => {
 e.preventDefault();
 const old = zoom;
 zoom = Math.max(editing ? .35 : .6, Math.min(editing ? 4 : 2.5, zoom * Math.exp(-e.deltaY * .001)));
 const x = e.clientX - W / 2,
  y = e.clientY - H / 2;
 pan = {
  x: x - (x - pan.x) * zoom / old,
  y: y - (y - pan.y) * zoom / old
 }
};

/* ---------- thumbnails + visual picker ---------- */
const thumbs = new Map();

function thumbOf(a, width = 120) {
 const key = a + '|' + width;
 if (thumbs.has(key)) return thumbs.get(key);
 const big = document.createElement('canvas');
 big.width = big.height = 560;
 const q = big.getContext('2d'),
  main = g;
 g = q;
 try {
  q.translate(280 - 1100, 520 - 700);
  drawArt(a, 0, 0, width, 1, false, 0, null)
 } catch (e) {} finally {
  g = main
 }
 const out = document.createElement('canvas');
 out.width = 112;
 out.height = 92;
 const o = out.getContext('2d');
 let bx = 0,
  by = 0,
  bw = 560,
  bh = 560,
  any = true;
 try {
  const d = q.getImageData(0, 0, 560, 560).data;
  let x0 = 560,
   y0 = 560,
   x1 = -1,
   y1 = -1;
  for (let y = 0; y < 560; y += 2)
   for (let x = 0; x < 560; x += 2)
    if (d[(y * 560 + x) * 4 + 3] > 20) {
     if (x < x0) x0 = x;
     if (x > x1) x1 = x;
     if (y < y0) y0 = y;
     if (y > y1) y1 = y
    } if (x1 < 0) any = false;
  else {
   bx = x0;
   by = y0;
   bw = x1 - x0 + 2;
   bh = y1 - y0 + 2
  }
 } catch (e) {}
 if (!any) return null;
 const sc = Math.min(104 / bw, 84 / bh, 1.2);
 o.drawImage(big, bx, by, bw, bh, (112 - bw * sc) / 2, (92 - bh * sc) / 2, bw * sc, bh * sc);
 thumbs.set(key, out);
 return out
}

function putThumb(slot, a, w) {
 slot.replaceChildren();
 const c = thumbOf(a, w);
 if (c) {
  const n = document.createElement('canvas');
  n.width = c.width;
  n.height = c.height;
  n.getContext('2d').drawImage(c, 0, 0);
  slot.append(n)
 } else {
  slot.textContent = '…';
  setTimeout(() => {
   if (slot.isConnected && !slot.querySelector('canvas')) putThumb(slot, a, w)
  }, 700)
 }
}

  d.querySelectorAll('[data-a]').forEach(b => {

   if (v) {

   }
  }
 };
 draw();
 d.showModal()
}
