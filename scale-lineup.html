/* one picture per character (the standing SW picture, or the frame picked from the Animation clips) — the SAME entry for 'battle' and 'village', so both views always agree */
async function addChar(id, name, kind, pic, factor) {
  const url = pic.url || pic.src, img = await load(url); if (!img) return; const m = measure(img, pic.flip); if (!m) return;

async function buildChars() {
  const list = ST ? ST.lineup.entities().map(e => ({ id: e.id === 'hero' ? 'hero' : e.id.replace(/^ally:/, ''), sid: e.id, name: e.name })) : [{ id: 'hero', sid: 'hero' }, ...Object.keys(ALLIES).map(k => ({ id: k, sid: 'ally:' + k }))];

    const pic = ST ? await ST.lineup.picture(c.sid, 'SW', PICK[c.id]?.clip, PICK[c.id]?.index) : { src: c.id === 'hero' ? HERO_SRC : `assets/village-town/npc/${c.id}/sw-stand.webp` };
    if (!pic) continue; await addChar(c.id, c.id === 'hero' ? 'ตัวเอก' : (ALLIES[c.id] || c.name), c.id === 'hero' ? 'hero' : 'ally', pic, c.id === 'hero' ? DS.hero : DS.ally);
  }
