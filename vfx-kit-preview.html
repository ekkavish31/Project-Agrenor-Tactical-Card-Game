<script>
const W = 300, H = 200, CW = 78, A = { x: 62, y: 158 }, P = { x: 222, y: 158 };
const NAMES = { sword: 'ดาบ ฟัน', knife: 'มีด ฟันไขว้', blunt: 'ค้อน/กระบอง ทุบ', spear: 'หอก แทง', rapier: 'เรเปียร์ แทงเร็ว', arrow: 'ธนู', shield: 'โล่ ป้องกัน', parry: 'ปัดป้อง',
  fire: 'ไฟ', ice: 'น้ำแข็ง', lightning: 'สายฟ้า', wind: 'ลม', water: 'น้ำ', earth: 'ดิน', holy: 'แสงศักดิ์สิทธิ์', dark: 'ความมืด', arcane: 'เวทอาร์เคน', heal: 'ฮีล',
  burn: 'ไหม้', poison: 'พิษ', sleep: 'หลับ', freeze: 'แข็ง', shock: 'ชา', weak: 'อ่อนแรง', silence: 'ใบ้', bind: 'เถาวัลย์' };
const DUR = { sword: 620, knife: 620, blunt: 760, spear: 640, rapier: 560, arrow: 720, shield: 900, parry: 620, fire: 1150, ice: 1150, lightning: 820, wind: 1050, water: 1100, earth: 950, holy: 1150, dark: 1200, arcane: 1150, heal: 1150 };
const cards = [];
function person(g, x, y, col, lean = 0) { g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(x, y, 20, 7, 0, 0, 7); g.fill(); g.fillStyle = col; g.beginPath(); g.roundRect(x - 13 + lean, y - 62, 26, 62, 10); g.fill(); g.beginPath(); g.arc(x + lean, y - 74, 14, 0, 7); g.fill() }
function scene(g, both = true) { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#1b2330'); gr.addColorStop(.62, '#27342a'); gr.addColorStop(1, '#31412f'); g.fillStyle = gr; g.fillRect(0, 0, W, H); if (both) person(g, A.x, A.y, '#7b8794'); person(g, P.x, P.y, '#8a6a5a') }
const K = 1.25;   /* tile canvas scale (the picker dialog draws at 2×) */
function mk(host, title, sub, draws) {   /* draws = [[caption, fn(g, t, now)], …] */
  const el = document.createElement('div'); el.className = 'card'; el.dataset.name = (title + ' ' + (sub || '')).toLowerCase(); el.innerHTML = `<div class="hd"><b title="${title}">${title}</b> <small>${sub || ''}</small></div><div class="pair${draws.length < 2 ? ' one' : ''}">${draws.map(d => `<figure><canvas width="${Math.round(W * K)}" height="${Math.round(H * K)}"></canvas><figcaption>${d[0]}</figcaption></figure>`).join('')}</div>`;
  host.append(el); const cvs = [...el.querySelectorAll('canvas')]; cards.push({ el, cvs, draws, k: K }); return el }
const fxCard = (host, kind, extra = {}, title) => { const dur = extra.dur || DUR[kind] || 700, e = { kind, seed: 7, from: A, color: '#ff8a5a', ...extra };
  const run = fn => (g, now) => { const cyc = dur + 520, t = ((now % cyc) / dur); scene(g); if (t <= 1) fn({ ...e, seed: 7 + Math.floor(now / cyc) }, t, g) };
  const oldFn = run((ev, t, g) => { const ok = BattleVFX.drawOld(ev.kind === 'impact' ? { ...ev, kind: 'impactCore' } : ev, t, P, A, g, { w: CW, h: CW / 2 }); if (!ok) { g.fillStyle = '#9a937f'; g.font = '12px sans-serif'; g.fillText('(ภาพเดิมยังโหลดไม่เสร็จ/ไม่มี)', 60, 24) } });
  const list = extra.old === false ? [['new', 'ใหม่']] : VfxKit.variants(kind);   /* [id, label] — 'old', 'new' and any look added later (VfxKit.addVariant) */
  const d = list.map(([id, label]) => [label, id === 'old' ? oldFn : run((ev, t, g) => VfxKit.draw(ev, t, P, A, g, { w: CW, h: CW / 2 }, id)), id]);
  const ttl = title || NAMES[kind] || kind, sub = kind + (extra.tier ? ' · ' + extra.tier : '');
  if (extra.old === false) { const c = mk(host, ttl, sub, d); c.dataset.old = '0'; return }
  /* the card shows ONLY the look the game uses now; click it to open the full list and change */
  const byId = Object.fromEntries(d.map(x => [x[2], x])), cur = () => byId[VfxKit.choiceOf(kind)] || byId.old;
  const active = run((ev, t, g) => BattleVFX.draw(
    ev.kind === 'impact' ? { ...ev, kind: 'impactCore' } : ev, t, P, A, g, { w: CW, h: CW / 2 }));
  let lastState;
  const c = mk(host, ttl, sub, [['', (g, now) => {
    active(g, now);
    const state = VfxKit.paintedState(e, VfxKit.choiceOf(kind));
    if (state !== lastState) {
      lastState = state;
      c.refresh();
    }
  }]]); c.dataset.old = '1'; c.dataset.kind = kind; c.classList.add('shown');
  const fig = c.querySelector('figure'), cap = fig.querySelector('figcaption'); c.refresh = () => { const id = VfxKit.choiceOf(kind), lb = cur()[0], bad = lastState === 'loading' ? ['l', 'กำลังโหลด'] : lastState === 'missing' ? ['l', 'ใช้ภาพสำรอง'] : id === 'old' ? ['o', 'เดิม'] : id === 'new' ? ['c', 'โค้ด'] : ['p', 'ภาพวาด'];
    cap.innerHTML = `<span class="badge ${bad[0]}">${bad[1]}</span><span class="lk" title="${lb}${extra.pick !== false && d.length > 1 ? ' · คลิกเพื่อเปลี่ยน (' + d.length + ' แบบ)' : ''}">${lb}</span>` };
  if (extra.pick !== false) { c.classList.add('pickable'); fig.style.cursor = 'pointer'; fig.title = 'คลิกเพื่อเลือกเอฟเฟกต์อื่นของท่านี้'; fig.classList.add('chosen'); fig.insertAdjacentHTML('beforeend', '<div class="use">✓ ในเกมใช้</div>'); fig.onclick = () => openPicker(kind, ttl, d) }
  c.refresh() };
/* picker: every look of one effect, animated; click one to use it in the game */
function openPicker(kind, ttl, d) { const dlg = document.getElementById('dlg'), box = document.getElementById('dlgGrid'); box.innerHTML = ''; document.getElementById('dlgTitle').textContent = ttl + ' — เลือกเอฟเฟกต์';
  const el = document.createElement('div'); el.className = 'pair many'; el.innerHTML = d.map(x => `<figure data-v="${x[2]}"><canvas width="${W * 2}" height="${H * 2}"></canvas><figcaption>${x[0]}</figcaption><div class="use">✓ ในเกมใช้</div></figure>`).join(''); box.append(el);
  const entry = { el: dlg, cvs: [...el.querySelectorAll('canvas')], draws: d.map(x => [x[0], x[1]]), picker: true, k: 2 }; cards.push(entry);
  const mark = () => el.querySelectorAll('figure').forEach(f => f.classList.toggle('chosen', VfxKit.choiceOf(kind) === f.dataset.v)); mark();
  const close = () => { dlg.hidden = true; const i = cards.indexOf(entry); if (i >= 0) cards.splice(i, 1) };
  el.onclick = ev => { const f = ev.target.closest('figure'); if (!f) return; VfxKit.setChoice(kind, f.dataset.v); mark(); syncPicks(); setTimeout(close, 220) };
  document.getElementById('dlgClose').onclick = close; dlg.onclick = ev => { if (ev.target === dlg) close() }; dlg.hidden = false }
for (const k of ['sword', 'knife', 'blunt', 'spear', 'rapier', 'arrow', 'shield', 'parry']) fxCard(gWeapon, k);
for (const k of ['fire', 'ice', 'lightning', 'wind', 'water', 'earth', 'holy', 'dark', 'arcane']) fxCard(gMagic, k);
fxCard(gMagic, 'heal', { color: '#7fe0a0' });
fxCard(gMagic, 'heal', { color: '#ffe08a', pick: false }, 'ฮีล (แสงทอง) — ใช้ค่าเดียวกับฮีล');
for (const [tier, n] of [['light', 'โดนตีเบา'], ['heavy', 'โดนตีหนัก'], ['critical', 'คริติคอล'], ['finisher', 'ปิดฉาก']]) fxCard(gHit, 'impact', { tier, dur: 520, pick: tier === 'light' }, n + (tier === 'light' ? ' — เลือกที่นี่ มีผลทั้ง 4 ระดับ' : ''));
fxCard(gHit, 'death', { dur: 2300, pick: false }, 'ล้ม · วิญญาณลอยขึ้น');
/* status: the same two layers the battle draws — behind the fighter, then in front */
for (const k of StatusFX.kinds) { const u = { id: 'pv-' + k, hp: 1, sts: k === 'freeze' || k === 'shock' ? null : { [k]: 9 }, stun: k === 'freeze' ? 1 : 0, slowed: k === 'shock' ? 1 : 0 };
  mk(gStatus, NAMES[k] || k, k, [['ในเกม', (g, now) => { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#1b2330'); gr.addColorStop(.62, '#27342a'); gr.addColorStop(1, '#31412f'); g.fillStyle = gr; g.fillRect(0, 0, W, H); const x = W / 2, y = 164; StatusFX.back(g, u, x, y, 104, now + 5000); person(g, x, y, '#8a6a5a'); StatusFX.front(g, u, x, y, 104, now + 5000) }]]) }
let speed = 1, clock = 0, last = performance.now();
function frame(now) { clock += (now - last) * speed; last = now;
  for (const c of cards) { const r = c.el.getBoundingClientRect(); if (r.bottom < -50 || r.top > innerHeight + 50) continue; c.cvs.forEach((cv, i) => { if (cv.offsetParent === null) return; const g = cv.getContext('2d'); const k = c.k || 2; g.setTransform(k, 0, 0, k, 0, 0); try { c.draws[i][1](g, clock) } catch (e) { } }) }
  requestAnimationFrame(frame) }
requestAnimationFrame(frame);
const GAME_KINDS = () => [...new Set([...document.querySelectorAll('.shown[data-kind]')].map(r => r.dataset.kind))];
function syncPicks() {
  const kinds = GAME_KINDS(), counts = { painted: 0, code: 0, old: 0 };
  cards.forEach(c => c.refresh?.());
  for (const kind of kinds) {
    const id = VfxKit.choiceOf(kind);
    counts[id === 'old' ? 'old' : id === 'new' ? 'code' : 'painted']++;
  }
  document.getElementById('sumUse').textContent = `ภาพวาด ${counts.painted} · โค้ดล้วน ${counts.code} · เดิม ${counts.old}`;
}
document.getElementById('usePainted').onclick = () => { VfxKit.resetChoices(); syncPicks(); };
addEventListener('storage', e => { if (e.key === VfxKit.KEY || e.key === null) syncPicks(); });
document.getElementById('allNew').onclick = () => { for (const k of GAME_KINDS()) VfxKit.setChoice(k, 'new'); syncPicks() };
document.getElementById('allOld').onclick = () => { for (const k of GAME_KINDS()) VfxKit.setChoice(k, 'old'); syncPicks() };
document.getElementById('pushBtn').onclick = async () => { const m = document.getElementById('pushMsg'), G = window.GitHubPush; if (!G) { m.textContent = 'ไม่พบระบบ Push'; return } if (!G.config().token) return G.openSettings();
  for (const k of GAME_KINDS()) VfxKit.setChoice(k, VfxKit.choiceOf(k));   /* write every kind out, so the pushed setting is complete */
  try { const t = await G.pushSettings([VfxKit.KEY], 'VFX สนามรบ: เลือกเดิม/ใหม่ต่อเอฟเฟกต์'); m.textContent = String(t || 'ใส่แล้ว') } catch (err) { m.textContent = 'ไม่สำเร็จ: ' + err.message } };

/* ---- categories · search · tile size (v98.1183) ---- */
const SECTIONS = [...document.querySelectorAll('section[data-cat]')];
let catNow = localStorage.getItem('vfx-cat') || 'all';
const catsEl = document.getElementById('cats'), qEl = document.getElementById('q');
function renderCats() {
  const counts = Object.fromEntries(SECTIONS.map(x => [x.dataset.cat, x.querySelectorAll('.card').length]));
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  catsEl.innerHTML = [['all', 'ทั้งหมด', total], ...SECTIONS.map(x => [x.dataset.cat, x.dataset.title.replace(/ \(.*\)$/, ''), counts[x.dataset.cat]])].map(([id, n, c]) => `<button data-c="${id}" aria-pressed="${id === catNow}">${n}<i>${c}</i></button>`).join('');
}
function applyFilter() {
  const q = qEl.value.trim().toLowerCase(); let shown = 0;
  for (const sec of SECTIONS) { const on = catNow === 'all' || catNow === sec.dataset.cat; let n = 0;
    sec.querySelectorAll('.card').forEach(c => { const ok = !q || c.dataset.name.includes(q); c.hidden = !ok; if (ok) n++ });
    sec.hidden = !on || !n; if (on) shown += n; sec.querySelector('h2 small').textContent = n + ' ท่า' }
  document.getElementById('empty').classList.toggle('on', !shown); document.getElementById('count').textContent = shown + ' ท่า';
  catsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === catNow)));
}
catsEl.onclick = e => { const b = e.target.closest('button'); if (!b) return; catNow = b.dataset.c; try { localStorage.setItem('vfx-cat', catNow) } catch (_) { } applyFilter() };
qEl.oninput = applyFilter;
const sizeSeg = document.getElementById('sizeSeg'); const setSize = v => { document.documentElement.style.setProperty('--tile', v + 'px'); sizeSeg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === String(v)))); try { localStorage.setItem('vfx-tile', v) } catch (_) { } };
sizeSeg.onclick = e => { const b = e.target.closest('button'); if (b) setSize(+b.dataset.s) }; setSize(+(localStorage.getItem('vfx-tile') || 210));
