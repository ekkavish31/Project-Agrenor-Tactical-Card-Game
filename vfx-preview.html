<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agrenor · Impact Core</title>
<link rel="stylesheet" href="css/thai-font.css?v=1"><script src="js/key-layout.js?v=1"></script><style>body{margin:0;background:#10151b;color:#f6e6c8;font:16px AgThai,system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px}p{color:#b7bec4}button,select,input{font:inherit;accent-color:#eeb85a}button,select{background:#25313c;color:#fff;padding:9px;border:1px solid #69727c;border-radius:6px}label{display:inline-flex;align-items:center;gap:8px;margin:8px}canvas{width:100%;background:#1c262d;border-radius:12px}a{color:#eeb85a}</style>
<main><h1>Impact Core · Combat VFX</h1><p>Original and Enhanced use the same weapon trail. Four impacts play at the hit point. Labels are drawn last.</p><label>Weapon <select id="weapon"><option>sword</option><option>knife</option><option>blunt</option><option>spear</option><option>fire</option></select></label><label>Speed <select id="speed"><option value=".5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option></select></label><label><input type="checkbox" id="reduced">Reduced motion</label><label><input type="checkbox" id="low">Low quality</label><button id="replay">Replay</button><p id="status">Loading impact texture…</p><canvas width="1080" height="580" id="preview"></canvas><p><a href="battle-field.html?battle=1">Play Enhanced</a> · <a href="battle-field.html?battle=1&impact=original">Play Original</a></p></main>
<script src="js/battle-vfx.js?v=98.139"></script><script>
const canvas=document.getElementById('preview'),g=canvas.getContext('2d'),keys=['light','heavy','critical','finisher'];window.BattlePolish={quality:'standard'};let elapsed=0,prev=0;document.getElementById('replay').onclick=()=>elapsed=0;
function frame(now){requestAnimationFrame(frame);elapsed+=(now-(prev||now))*+document.getElementById('speed').value;prev=now;const ms=elapsed%1800,rm=document.getElementById('reduced').checked||BattleVFX.reducedMotion();BattlePolish.quality=document.getElementById('low').checked?'low':'standard';document.getElementById('status').textContent=BattleVFX.impactReady()?'Texture ready · 4 levels · original fallback retained':'Texture unavailable: original effects active';g.clearRect(0,0,1080,580);for(let row=0;row<2;row++)for(let i=0;i<4;i++){const p={x:135+i*270,y:215+row*270},a={x:p.x-85,y:p.y},tier=keys[i];g.fillStyle='#bcc6c8';g.font='16px AgThai,system-ui';g.textAlign='center';g.fillText((row?'ENHANCED':'ORIGINAL')+' · '+tier,p.x,p.y-170);g.fillStyle='#354852';g.beginPath();g.ellipse(p.x,p.y,55,17,0,0,7);g.fill();g.fillStyle='#819584';g.fillRect(p.x-17,p.y-75,34,67);g.fillStyle='#d1b798';g.beginPath();g.arc(p.x,p.y-91,19,0,7);g.fill();if(ms<650)BattleVFX.draw({kind:weapon.value,seed:12},ms/650,p,a,g,{w:70});const hit=ms-290,d=BattleVFX.impactSpec(tier).duration;if(hit>=0&&hit<d){if(row&&BattleVFX.impactReady())BattleVFX.draw({kind:'impactCore',tier,seed:4,reducedMotion:rm},hit/d,p,a,g,{w:70});else BattleVFX.stamp(g,'particle/hit',p.x,p.y-45,90,{alpha:1-hit/d});g.fillStyle='#ffe5a0';g.font='bold 23px AgThai,system-ui';g.fillText(['8','24','CRIT 36','52'][i],p.x,p.y-125-(rm?0:hit*.035));}}}requestAnimationFrame(frame);
</script></html>
