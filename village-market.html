function blocked(u,v){return u< -10.5||u>10.5||v< -9.5||v>10||shops.some(s=>Math.abs(u-s.u)<s.w+.2&&Math.abs(v-s.v)<s.d+.2)}

function route(from,to){if(blocked(to.u,to.v))return[];const end={u:Math.round(to.u*2)/2,v:Math.round(to.v*2)/2},start={u:Math.round(from.u*2)/2,v:Math.round(from.v*2)/2};if(blocked(start.u,start.v)||blocked(end.u,end.v)||!clear(from,start))return[];const open=[start],cost=new Map([[key(start),0]]),prev=new Map(),closed=new Set();let found=null;
 while(open.length){open.sort((a,b)=>(cost.get(key(a))+Math.hypot(a.u-end.u,a.v-end.v))-(cost.get(key(b))+Math.hypot(b.u-end.u,b.v-end.v)));const a=open.shift(),ak=key(a);if(closed.has(ak))continue;closed.add(ak);if(ak===key(end)){found=a;break}for(const[du,dv]of[[.5,0],[-.5,0],[0,.5],[0,-.5],[.5,.5],[.5,-.5],[-.5,.5],[-.5,-.5]]){const b={u:a.u+du,v:a.v+dv},bk=key(b),n=cost.get(ak)+Math.hypot(du,dv);if(closed.has(bk)||blocked(b.u,b.v)||!clear(a,b)||n>=(cost.get(bk)??Infinity))continue;cost.set(bk,n);prev.set(bk,a);open.push(b)}}
 if(!found)return[];const out=[found];while(key(found)!==key(start)){found=prev.get(key(found));out.unshift(found)}return out;
}
function travel(s){target=s;path=route(hero,s.door);$('status').textContent=path.length?'กำลังเดินไป'+s.name:'เดินไปจุดนี้ไม่ได้';if(!path.length&&Math.hypot(hero.u-s.door.u,hero.v-s.door.v)<.6)arrive()}

function drawFloor(){const t=terrain.getContext('2d');t.fillStyle=TownArt.pattern(t,'grass')||'#7d906b';t.fillRect(0,0,2200,1400);const pts=[[-11,-10],[11,-10],[11,11],[-11,11]].map(([u,v])=>project(u,v));t.beginPath();pts.forEach((p,i)=>t[i?'lineTo':'moveTo'](p.x,p.y));t.closePath();t.fillStyle=TownArt.pattern(t,'paving')||'#c9bca0';t.fill();t.strokeStyle=TownArt.pattern(t,'soil')||'#938569';t.lineWidth=16;t.lineJoin='round';t.stroke();
 for(let i=0;i<120;i++){const u=-15+(Math.sin(i*72.7)*.5+.5)*30,v=-15+(Math.sin(i*16.9)*.5+.5)*30;if(u>-11.5&&u<11.5&&v>-10.5&&v<11.5)continue;TownArt.detail(t,i%7===0?1:0,project(u,v),35)}
}
function focus(){const p=project(hero.u,hero.v);pan={x:-(p.x-1100)*scale*zoom,y:H*.12-(p.y-700)*scale*zoom}}

function rect(s){const im=TownArt.asset(s.id),p=project(s.u,s.v),w=s.width,h=im.naturalWidth?w*im.naturalHeight/im.naturalWidth:w;return{x:p.x-w*.5,y:p.y-h*.86,w,h}}
function draw(t){requestAnimationFrame(draw);if(!active||document.hidden){last=t;return}const dt=Math.min(.08,(t-last)/1000||0);last=t;if(path.length){const b=path[0],du=b.u-hero.u,dv=b.v-hero.v,n=Math.hypot(du,dv),step=dt*6;if(n<=step){hero.u=b.u;hero.v=b.v;path.shift();if(!path.length)arrive()}else{hero.u+=du/n*step;hero.v+=dv/n*step;const dx=du-dv,dy=du+dv;hero.dir=dy>=0?(dx>=0?'SE':'SW'):(dx>=0?'NE':'NW')}}
 window.MarketCamera?.update(dt);g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.fillStyle=TownArt.pattern(g,'grass')||'#7d906b';g.fillRect(0,0,W,H);g.translate(W/2+pan.x,H/2+pan.y);g.scale(scale*zoom,scale*zoom);g.translate(-1100,-700);if(dirty){drawFloor();dirty=false}g.drawImage(terrain,0,0);
 if(path.length){g.strokeStyle='#e4ce8e';g.lineWidth=2;g.setLineDash([6,7]);g.beginPath();const p=project(hero.u,hero.v);g.moveTo(p.x,p.y);for(const b of path){const q=project(b.u,b.v);g.lineTo(q.x,q.y)}g.stroke();g.setLineDash([])}
 const hp=project(hero.u,hero.v);TownArt.begin(g,hp);const objects=shops.map(s=>({y:project(s.u,s.v).y,draw:()=>{const im=TownArt.asset(s.id),r=rect(s);TownArt.draw(g,im,null,[r.x,r.y,r.w,r.h],hp)}}));
 for(let i=0;i<22;i++){const side=i%2===0,u=side?-12:12,v=-9+Math.floor(i/2)*1.9,p=project(u,v),im=TownArt.asset('props'),sw=im.naturalWidth/4,sh=im.naturalHeight/2,index=i%4===0?7:2,w=index===7?210:85;objects.push({y:p.y,draw:()=>{if(im.naturalWidth)TownArt.draw(g,im,[index%4*sw,Math.floor(index/4)*sh,sw,sh],[p.x-w/2,p.y-w*.92,w,w],hp)}})}
 objects.push({y:hp.y,draw:()=>{g.fillStyle='#182b2866';g.beginPath();g.ellipse(hp.x,hp.y,13,6,0,0,Math.PI*2);g.fill();TownArt.hero(g,hp,hero.dir,t,path.length>0,80)}});objects.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
 hitRects=shops.map(s=>({s,...rect(s)}));for(const s of[...shops,exit]){const p=project(s.door.u,s.door.v);g.font='14px TownThai,system-ui';g.textAlign='center';const w=g.measureText(s.name).width+24;g.fillStyle='#233a2ee8';g.fillRect(p.x-w/2,p.y+18,w,29);g.fillStyle='#f6e8bd';g.fillText(s.name,p.x,p.y+38)}

}
function world(e){return{x:(e.clientX-W/2-pan.x)/(scale*zoom)+1100,y:(e.clientY-H/2-pan.y)/(scale*zoom)+700}}
let drag=null;cv.onpointerdown=e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,pan:{...pan},moved:false};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved)pan={x:drag.pan.x+dx,y:drag.pan.y+dy}};cv.onpointerup=e=>{if(drag&&!drag.moved){const p=world(e),s=hitRects.slice().reverse().find(r=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)?.s;if(s)travel(s);else{const q=inv(p.x,p.y);if(Math.hypot(q.u-exit.door.u,q.v-exit.door.v)<1.3)travel(exit);else{target=null;path=route(hero,q);$('status').textContent=path.length?'กำลังเดิน…':'เดินได้เฉพาะลานและทางเดิน'}}}drag=null};cv.onpointercancel=()=>drag=null;
cv.onwheel=e=>{e.preventDefault();const old=zoom;zoom=Math.max(.7,Math.min(2.5,zoom*Math.exp(-e.deltaY*.001)));const x=e.clientX-W/2,y=e.clientY-H/2;pan={x:x-(x-pan.x)*zoom/old,y:y-(y-pan.y)*zoom/old}};

window.Market25D={shops:()=>shops.map(s=>({...s,door:{...s.door}})),getHero:()=>({...hero}),getPath:()=>path.map(p=>({...p})),travel:id=>travel(id==='exit'?exit:shops.find(s=>s.id===id)),route,blocked,project,setHero:p=>{Object.assign(hero,p);path=[];target=null},getCamera:()=>({W,H,scale,zoom,pan})};
