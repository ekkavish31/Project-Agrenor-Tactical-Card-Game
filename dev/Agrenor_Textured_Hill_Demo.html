function makeTile(t){let p=points(t),faces=[];for(const [dx,dy,a,b,na,nb]of [[1,0,1,2,0,3],[0,1,2,3,1,0]]){let n=at(t.x+dx,t.y+dy),nc=n&&!n.void?n.surfaceCorners:[-.5,-.5,-.5,-.5],za=t.surfaceCorners[a],zb=t.surfaceCorners[b],da=Math.max(0,za-nc[na]),db=Math.max(0,zb-nc[nb]);if(da>.001||db>.001)faces.push({p:[p[a],p[b],{x:p[b].x,y:p[b].y+db*21},{x:p[a].x,y:p[a].y+da*21}],dx,drop:Math.max(da,db)})}
let all=[...p,...faces.flatMap(f=>f.p)],x=Math.floor(Math.min(...all.map(q=>q.x))-24),y=Math.floor(Math.min(...all.map(q=>q.y))-42),x1=Math.ceil(Math.max(...all.map(q=>q.x))+24),y1=Math.ceil(Math.max(...all.map(q=>q.y))+15),img=document.createElement('canvas');img.width=x1-x;img.height=y1-y;let g=img.getContext('2d');g.translate(-x,-y);
for(let f of faces){poly(g,f.p,'#817b64');texture(g,mats[2],f.p,(t.x+t.y)%6*128,0,128,Math.max(64,f.drop*100));poly(g,f.p,f.dx?'#17271b35':'#f6df9d0e')}
poly(g,p,t.route?'#baab78':'#7d8f4e');texture(g,mats[t.route?1:0],p,t.x%16*64,t.y%16*64,64,64);poly(g,p,t.route?'#efd8a022':'#d0cc8b18');
for(let f of faces){g.strokeStyle=t.route?'#b4a170':'#80944d';g.lineWidth=2.5;g.beginPath();g.moveTo(f.p[0].x,f.p[0].y);g.lineTo(f.p[1].x,f.p[1].y);g.stroke();if(!t.route)for(let j=0;j<7;j++){let k=(j+.5)/7,a=f.p[0],b=f.p[1],xx=a.x*(1-k)+b.x*k,yy=a.y*(1-k)+b.y*k;g.strokeStyle=j%2?'#a7b86c':'#718843';g.lineWidth=1;g.beginPath();g.moveTo(xx,yy+1);g.lineTo(xx-1.2,yy-3-noise(t.x+j,t.y)*3);g.stroke()}}
if(t.ramp==='steps')for(let k=0;k<3;k++){let f=(k+.5)/3,a,b;if(t.y===5||t.y===6){a=point(t.x-.5+f,t.y-.45,height(t.x-.5+f,t.y));b=point(t.x-.5+f,t.y+.45,height(t.x-.5+f,t.y))}else{a=point(t.x-.45,t.y-.5+f,height(t.x,t.y-.5+f));b=point(t.x+.45,t.y-.5+f,height(t.x,t.y-.5+f))}g.strokeStyle='#6c6044bb';g.lineWidth=2;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.strokeStyle='#e5d6b3aa';g.lineWidth=.6;g.beginPath();g.moveTo(a.x,a.y-1);g.lineTo(b.x,b.y-1);g.stroke()}
if(t.prop){let q=point(t.x,t.y,t.h),r=14+noise(t.x,t.y)*5,shape=[{x:q.x-r,y:q.y},{x:q.x-r*.8,y:q.y-r},{x:q.x,y:q.y-r*1.65},{x:q.x+r*.8,y:q.y-r},{x:q.x+r,y:q.y},{x:q.x,y:q.y+r*.4}];g.save();poly(g,shape);g.clip();g.drawImage(mats[2],t.x*20%500,t.y*20%500,200,200,q.x-r,q.y-r*1.7,r*2,r*2.2);poly(g,[shape[2],shape[3],shape[4],shape[5]],'#15281b44');g.restore()}
return {t,p,faces,img,x,y};}
function unit(u,color,label){let q=point(u.x,u.y,height(u.x,u.y));ctx.fillStyle='#15271c66';ctx.beginPath();ctx.ellipse(q.x+3,q.y+2,9,4,0,0,7);ctx.fill();let swing=busy?Math.sin(u.x*7+u.y*7)*2:0;ctx.strokeStyle='#34494a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(q.x-2,q.y-10);ctx.lineTo(q.x-4+swing,q.y);ctx.moveTo(q.x+3,q.y-10);ctx.lineTo(q.x+4-swing,q.y);ctx.stroke();poly(ctx,[{x:q.x-7,y:q.y-25},{x:q.x+6,y:q.y-25},{x:q.x+8,y:q.y-9},{x:q.x-8,y:q.y-9}],color,'#b7c1b8');ctx.fillStyle='#d1bd96';ctx.beginPath();ctx.arc(q.x,q.y-30,5,0,7);ctx.fill();ctx.fillStyle='#b8c7c8';ctx.fillRect(q.x-6,q.y-35,12,4);ctx.strokeStyle='#e9eddf';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.x+9,q.y-12);ctx.lineTo(q.x+15,q.y-29);ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.arc(q.x,q.y-47,7,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='10px sans-serif';ctx.fillText(label,q.x,q.y-44)}
function draw(){let w=root.clientWidth||800,dpr=Math.min(2,window.devicePixelRatio||1);scale=w/W;let cw=Math.round(w*dpr),ch=Math.round(H*scale*dpr);if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;canvas.style.height=H*scale+'px'}ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#d0d0bb');bg.addColorStop(1,'#b2b99d');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);if(!ready)return;ctx.fillStyle='#37462b20';ctx.beginPath();ctx.ellipse(520,405,418,185,0,0,7);ctx.fill();let keys=new Set(route.map(q=>C.key(q.x,q.y)));for(let s of sprites){ctx.drawImage(s.img,s.x,s.y);if(grid){poly(ctx,s.p,null,'#fff7d466',.7);if(s.t.blocked)poly(ctx,s.p,'#b3383355');for(let [dx,dy,a,b]of [[1,0,1,2],[0,1,2,3]]){let n=at(s.t.x+dx,s.t.y+dy);if(n&&!n.void&&!s.t.exits.includes(C.key(n.x,n.y))){ctx.strokeStyle='#ad3631dd';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.p[a].x,s.p[a].y);ctx.lineTo(s.p[b].x,s.p[b].y);ctx.stroke()}}}if(keys.has(C.key(s.t.x,s.t.y))){let q=point(s.t.x,s.t.y,height(s.t.x,s.t.y));ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.arc(q.x,q.y,2.5,0,7);ctx.fill()}if(selected===s.t)poly(ctx,s.p,s.t.blocked?'#e8595266':'#ffefa544','#fff4b5',1.5);for(let [u,c,m]of [[P,'#347b9e','P'],[A,'#b85843','A']])if(Math.round(u.x)===s.t.x&&Math.round(u.y)===s.t.y)unit(u,c,m)}}
function reset(){P={...map.start,traits:[],hp:60};A={...map.enemy,traits:[],hp:60};route=[];selected=null;status.textContent='เลือกช่องบนพื้น หรือทดลองเดินขึ้นยอด · ไม่จำกัดแต้มเดินในฉากทดสอบ';draw()}
function select(t){selected=t;let r=C.reachable(map,P,999,[A]);route=C.pathTo(r,t)||[];status.textContent=t.blocked?'ก้อนหิน · ช่องนี้ยืนไม่ได้':route.length?'H'+t.h+' · '+(route.length-1)+' ช่อง · ค่าเดิน '+r.costs.get(C.key(t.x,t.y)):'ช่องนี้มีตัวละครอยู่ หรือไม่มีทางเข้าถึง';draw()}
function contains(p,x,y){let v=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let a=p[i],b=p[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)v=!v}return v}
canvas.addEventListener('click',e=>{if(busy||!ready)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/scale,y=(e.clientY-r.top)/scale;for(let s of [...sprites].reverse()){if(contains(s.p,x,y)){select(s.t);return}if(s.faces.some(f=>contains(f.p,x,y))){status.textContent='หน้าผา · เลือกพื้นด้านบน หรือใช้ทางลาด/บันได';return}}});
async function walk(u,p){if(busy||!p||p.length<2)return;busy=true;root.querySelectorAll('button').forEach(b=>b.disabled=true);for(let i=1;i<p.length;i++){let a=p[i-1],b=p[i];await new Promise(resolve=>{let start=performance.now(),duration=matchMedia('(prefers-reduced-motion: reduce)').matches?1:125;function frame(now){let k=Math.min(1,(now-start)/duration);u.x=a.x+(b.x-a.x)*k;u.y=a.y+(b.y-a.y)*k;draw();if(k<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});u.x=b.x;u.y=b.y}busy=false;route=[];root.querySelectorAll('button').forEach(b=>b.disabled=false);status.textContent=(u===P?'ผู้เล่น':'ตัวทดสอบ AI')+' ถึง H'+at(u.x,u.y).h+' · ใช้ทางขึ้นลงตามพื้นจริง';draw()}
root.querySelectorAll('button').forEach(b=>b.onclick=()=>{switch(b.dataset.a){case 'up':select(at(11,8));walk(P,route);break;case 'ai':route=C.pathTo(C.reachable(map,A,999,[P]),map.landmarks.eastFoot)||[];walk(A,route);break;case 'move':walk(P,route);break;case 'grid':grid=!grid;b.setAttribute('aria-pressed',String(grid));draw();break;case 'reset':reset();break}});
root._review={map,select,draw,get player(){return P},get enemy(){return A},get ready(){return ready},get busy(){return busy}};
new ResizeObserver(draw).observe(root);reset();let atlas=new Image();atlas.onload=()=>{for(let q=0;q<4;q++){let c=document.createElement('canvas');c.width=c.height=1024;let g=c.getContext('2d');for(let y=0;y<2;y++)for(let x=0;x<2;x++){g.save();g.translate(x?1024:0,y?1024:0);g.scale(x?-1:1,y?-1:1);g.drawImage(atlas,q%2*atlas.width/2,Math.floor(q/2)*atlas.height/2,atlas.width/2,atlas.height/2,0,0,512,512);g.restore()}mats.push(c)}sprites=map.tiles.filter(t=>!t.void).sort((a,b)=>a.x+a.y-b.x-b.y||a.x-b.x).map(makeTile);ready=true;draw()};atlas.onerror=()=>status.textContent='ไม่สามารถโหลด texture ได้';atlas.src=root.querySelector('[data-atlas]').src;
})();

</script>
