<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agrenor · Terrain modules</title><style>body{margin:0;background:#202923;color:#eee4ce;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:24px}nav{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px;background:#e8dfc5;color:#283e34;border:0;border-radius:5px}canvas{width:100%;background:#bcc3ac;border-radius:8px;margin-top:12px}#info{color:#c9c8a8;font-size:14px}p{line-height:1.6}</style><main><h1>Agrenor · คลังชิ้นส่วนสนาม</h1><nav><input id="seed" value="AGRENOR-01" aria-label="Seed"><button id="generate">สร้างจาก seed</button><button id="random">สุ่มใหม่</button><button id="rotate">หมุนกล้อง</button><button id="grid">ช่องเดิน / ทางตัน</button></nav><p id="info"></p><canvas id="map" width="1100" height="760"></canvas><p id="status">คลิกช่องเพื่อทดลองเดิน · จุดสีฟ้าคือตัวทดสอบทางเดิน · สีแดงคือพื้นที่ยืนไม่ได้</p><p>ใช้ข้อมูลและระบบหาเส้นทางเดียวกับฉากต่อสู้จริง หน้านี้ใช้สัญลักษณ์แทนตัวละครเพื่อดูภูมิประเทศได้ชัดเจน</p></main><script src="../js/tactics-terraced-hill.js"></script><script src="../js/tactics-map-modules.js"></script><script src="../js/tactics-core.js"></script><script src="../js/tactics-surface.js"></script><script src="../js/tactics-hill-art.js"></script><script>
const C=TacticsCore,S=TacticsSurface,canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let map,player,angle=0,grid=false,route=[],busy=false;
function rc(x,y){let a=angle*Math.PI/2,dx=x-17,dy=y-17;return [17+dx*Math.cos(a)-dy*Math.sin(a),17+dx*Math.sin(a)+dy*Math.cos(a)]}function depth(x,y){let [a,b]=rc(x,y);return a+b}function point(x,y,z){let [a,b]=rc(x,y);return {x:550+(a-b)*15,y:55+(a+b)*8-z*17}}
function poly(p,fill,stroke){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.7;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,1100,760);const keys=new Set(route.map(p=>C.key(p.x,p.y)));for(const t of [...map.tiles].sort((a,b)=>depth(a.x,a.y)-depth(b.x,b.y))){TacticsHillArt.drawTile(ctx,map,t,point,depth);let g=TacticsHillArt.geometry(map,t,point,depth);if(grid){poly(g.p,t.blocked?'#bd433466':null,'#fff6');for(const [dx,dy,a,b]of [[1,0,1,2],[0,1,2,3]])if(C.at(map,t.x+dx,t.y+dy)&&!t.exits.includes(C.key(t.x+dx,t.y+dy))){ctx.strokeStyle='#b54735';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(g.p[a].x,g.p[a].y);ctx.lineTo(g.p[b].x,g.p[b].y);ctx.stroke()}}const p=point(t.x,t.y,S.height(map,t.x,t.y));if(t.prop){ctx.fillStyle=t.prop==='tree'?'#365739':t.prop==='pillar'?'#b7b099':'#6f7567';ctx.beginPath();ctx.ellipse(p.x,p.y-10,t.prop==='tree'?10:7,t.prop==='tree'?16:10,0,0,7);ctx.fill()}if(keys.has(C.key(t.x,t.y))){ctx.fillStyle='#fff0ab';ctx.beginPath();ctx.arc(p.x,p.y,2,0,7);ctx.fill()}if(Math.round(player.x)===t.x&&Math.round(player.y)===t.y){let u=point(player.x,player.y,S.height(map,player.x,player.y));ctx.fillStyle='#32b5da';ctx.strokeStyle='#e4ffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y-5,6,0,7);ctx.fill();ctx.stroke()}}}
function generate(){if(busy)return;map=C.generate($('seed').value,'modular-wilds','battle');player={...map.start,traits:[]};route=[];$('info').textContent=map.placements.map(p=>p.name).join(' · ')+' | เดินเชื่อมถึงกัน '+map.validation.walkable+' ช่อง';draw()}
$('generate').onclick=generate;$('random').onclick=()=>{if(busy)return;$('seed').value='AGRENOR-'+Math.floor(Math.random()*100000);generate()};$('rotate').onclick=()=>{angle=(angle+1)%4;draw()};$('grid').onclick=()=>{grid=!grid;draw()};canvas.onclick=async e=>{if(busy)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*1100/r.width,y=(e.clientY-r.top)*760/r.height;let target;for(const t of [...map.tiles].sort((a,b)=>depth(b.x,b.y)-depth(a.x,a.y))){let g=TacticsHillArt.geometry(map,t,point,depth);if(S.contains(g.p,x,y)){target=t;break}if(g.faces.some(f=>S.contains(f,x,y)))break}if(!target)return;route=C.pathTo(C.reachable(map,player,10000,[]),target)||[];if(!route.length){$('status').textContent='พื้นที่นี้ยืนไม่ได้';return}busy=true;$('status').textContent='เดินตามทางจริง '+(route.length-1)+' ช่อง ไป H'+target.h;for(let i=1;i<route.length;i++){let a=route[i-1],b=route[i];await new Promise(resolve=>{let start=performance.now();function step(now){let f=Math.min(1,(now-start)/70);player.x=a.x+(b.x-a.x)*f;player.y=a.y+(b.y-a.y)*f;draw();if(f<1)requestAnimationFrame(step);else resolve()}requestAnimationFrame(step)})}route=[];busy=false;draw()};generate();let attempts=0;function ready(){draw();if(!TacticsHillArt.ready&&attempts++<100) setTimeout(ready,100)}ready();
</script></html>
