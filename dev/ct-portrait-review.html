<!doctype html><html lang="th"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจครอปหน้า CT</title><style>body{margin:20px;background:#19242e;color:#fff1d0;font:16px sans-serif}button,input,select{font:inherit}button{padding:8px}main{display:flex;gap:28px;flex-wrap:wrap}#source{width:min(500px,80vw);height:420px;object-fit:contain;background:#30404d}#face{width:96px;height:96px;border:3px solid #e9c36d}.previews{display:flex;gap:16px;align-items:end}#small{width:36px;height:36px;border:2px solid #e9c36d}label{display:block;margin:18px 0}input{width:220px}#status{min-height:30px}
#overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px;margin-top:24px}#overview[hidden]{display:none}.ct-tile{display:flex;flex-direction:column;align-items:center;gap:7px;background:#263b48;color:#fff1d0;border:1px solid #71838c;border-radius:7px;cursor:pointer}.ct-tile span{display:block;width:80px;height:80px}.ct-tile b{font-size:12px}
</style><h1>ตรวจครอปใบหน้าจากการ์ด CT</h1><p>เลือกตัวละคร ปรับศูนย์กลางและขนาด แล้วบันทึก · เปิดจากโฟลเดอร์เดียวกับเกม · ล้างการปรับเพื่อกลับค่าที่ติดตั้ง</p><button id="toggleOverview" aria-expanded="false">ดูหน้าทั้งหมด 45 ตัว</button> <select id="unit"></select><main><img id="source"><section><div class="previews"><div id="face"></div><div id="small"></div></div><label>ตำแหน่ง X <input id="cx" type="range" min="0" max="1" step=".005"><output id="ox"></output></label><label>ตำแหน่ง Y <input id="cy" type="range" min="0" max="1" step=".005"><output id="oy"></output></label><label>ขนาดกรอบ <input id="extent" type="range" min=".1" max="1" step=".005"><output id="oe"></output></label><button id="save">บันทึกตัวนี้</button> <button id="reset">คืนค่าตัวนี้</button> <button id="export">ส่งออก JSON</button><p id="status"></p></section></main><section id="overview" hidden aria-label="ใบหน้า CT ทั้งหมด"></section><script src="js/unit-card-art.js"></script><script>
const key='project-a-ct-crops-v32',el=id=>document.getElementById(id);let overrides={};try{overrides=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let entries=Object.entries(UNIT_CARD_ART);el('unit').innerHTML=entries.map(([id])=>'<option>'+id+'</option>').join('');let def,crop;
function select(){def=UNIT_CARD_ART[el('unit').value];crop=[...(overrides[el('unit').value]||def.ctCrop)];el('source').src=def.src;['cx','cy','extent'].forEach((id,i)=>el(id).value=crop[i]);render()}
function cropStyle(d,c){let [w,h]=d.ctSize,side=Math.min(w,h)*c[2],x=Math.max(0,Math.min(w-side,c[0]*w-side/2)),y=Math.max(0,Math.min(h-side,c[1]*h-side/2));return {backgroundImage:'url('+JSON.stringify(d.src)+')',backgroundSize:(w/side*100)+'% '+(h/side*100)+'%',backgroundPosition:(w===side?50:x/(w-side)*100)+'% '+(h===side?50:y/(h-side)*100)+'%'}}
function renderOverview(){let box=el('overview');if(box.hidden)return;box.replaceChildren();for(let [id,d]of Object.entries(UNIT_CARD_ART)){let b=document.createElement('button'),f=document.createElement('span'),label=document.createElement('b');b.type='button';b.className='ct-tile';b.dataset.cardId=id;b.setAttribute('aria-label','ปรับ '+id);Object.assign(f.style,cropStyle(d,id===el('unit').value?crop:overrides[id]||d.ctCrop));label.textContent=id;b.append(f,label);b.onclick=()=>{el('unit').value=id;select();el('unit').focus()};box.append(b)}}
function render(){crop=['cx','cy','extent'].map(id=>+el(id).value);['ox','oy','oe'].forEach((id,i)=>el(id).value=crop[i]);for(let id of ['face','small'])Object.assign(el(id).style,cropStyle(def,crop));renderOverview()}
el('toggleOverview').onclick=()=>{let b=el('overview');b.hidden=!b.hidden;el('toggleOverview').setAttribute('aria-expanded',String(!b.hidden));el('toggleOverview').textContent=b.hidden?'ดูหน้าทั้งหมด 45 ตัว':'ซ่อนภาพรวม';renderOverview()};
el('unit').onchange=select;['cx','cy','extent'].forEach(id=>el(id).oninput=render);el('save').onclick=()=>{overrides[el('unit').value]=crop;try{localStorage.setItem(key,JSON.stringify(overrides));el('status').textContent='บันทึกแล้ว · เปิดเกมใหม่เพื่อใช้ค่า'}catch(e){el('status').textContent='บันทึกไม่ได้ ให้ส่งออก JSON เก็บไว้'}};el('reset').onclick=()=>{delete overrides[el('unit').value];try{localStorage.setItem(key,JSON.stringify(overrides))}catch(e){}select()};el('export').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(overrides,null,2)],{type:'application/json'}));a.href=url;a.download='ct-crops-v32.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};select();
</script></html>
