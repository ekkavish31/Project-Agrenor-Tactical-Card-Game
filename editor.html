<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project A Editor</title>
<style>
:root{--bg:#1a1510;--bar:#241d15;--line:#4a3b29;--text:#f3e7cf;--muted:#bba57f;--gold:#f6d79b;--accent:#c9893a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Noto Sans Thai",sans-serif;overflow:hidden}
header{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line)}\n#deployStatus{font-size:11px;color:var(--muted);white-space:nowrap;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#17130f}#deployStatus.latest{color:#a9d9a4;border-color:#466b40}#deployStatus.waiting{color:#f3d08d;border-color:#9c7332}
header h1{font-size:16px;margin:0 12px 0 0;color:var(--gold);white-space:nowrap}
nav{display:flex;gap:4px;flex:1;min-width:0;overflow:auto}
nav button{background:#30271d;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;font:inherit}
nav button:hover{border-color:var(--accent)}
nav button.on{background:var(--accent);border-color:#8a5a20;color:#fff}
header a,header button.tool{color:var(--text);background:#30271d;border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-decoration:none;cursor:pointer;font:inherit;white-space:nowrap}
.note{height:26px;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--muted);background:#1f1912;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{position:absolute;top:49px;left:0;right:0;bottom:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111}
iframe[hidden]{display:none}
#note{display:none}
</style>
</head>
<body>
<header>
 <h1>✎ Project A · Editor</h1>
 <nav id="tabs"></nav><span id="deployStatus">กำลังตรวจสถานะเว็บ…</span>
 <button class="tool" id="stagedPush" disabled title="ส่งภาพ/ไฟล์ที่แก้ค้างไว้ (จาก Asset Studio / Workshop ทุกแท็บ) ขึ้น GitHub เป็น commit เดียว" style="background:#496b3b;border-color:#6f9a5a;font-weight:700">⬆ รอ Push (0)</button><button class="tool" id="stagedDrop" hidden title="ทิ้งงานที่ยังไม่ push ทั้งหมด">ทิ้ง</button>
 <button class="tool" id="reload" title="โหลดแท็บนี้ใหม่">↻ โหลดใหม่</button>
 <a href="index.html" target="_blank" title="เปิดเกมในแท็บใหม่">▶ เปิดเกม</a>
</header>
<div class="note" id="note"></div><div id="editorConflict" hidden role="status"></div>
<main id="frames"></main>
<script src="js/webp-redirect.js?v=92.04"></script><script src="js/game-version.js?v=95.27"></script><script src="js/game-settings.js?v=82.15"></script><script src="js/editor-deploy-status.js?v=91.45"></script><script src="js/game-dialog.js"></script><script src="js/github-push.js"></script><script>
// Editor shell: every tool runs in its own frame; the game opens in "editor mode" (no play-save writes).
// All tools share this browser's storage with the game — reload the game to see changes.
const TABS=[
 {id:'assets',name:'🧰 Workshop / Asset Studio',src:'asset-studio.html',note:'จัดการภาพทั้งหมด · แอนิเมชันตัวละคร/มอนสเตอร์ทุกท่าทุกทิศ · ส่งคำขอเจนเป็นชุด · นำเข้า frame sheet แล้วตัดภาพอัตโนมัติ · บันทึกแล้ว push ขึ้นเกมได้'},
 {id:'cards',name:'🃏 การ์ด',src:'index.html?editor=cards',note:'โต๊ะออกแบบการ์ด 9 ประเภท · ส่งออก ZIP เพื่อใส่เกมถาวร · ปุ่ม "ทดลองในเกม" ใช้ค่าจากที่นี่ในเกมทันที'},
 {id:'map',name:'🗺 แผนที่หมู่บ้าน & ถนน',src:'village-town.html?edit=1',note:'แก้ผังหมู่บ้านอย่างเดียว · มุมมองอิสระ ลาก/ซูมได้ · ถนน อาคาร ของประดับ ประตู มุมเอียง ขนาดตัวละคร · ปุ่มทดสอบเดินตัวเอกและ NPC · บันทึกแล้ว push ขึ้นเกม'},
 {id:'battle',name:'⚔ สนามต่อสู้',src:'battleground.html',note:'Battleground Editor · แถบบน = เลือกชิ้น + เครื่องมือ (ความสูง/พื้น/ของ/ลบ) · แถบล่าง = แคตตาล็อกและขนาดแปรง · แผงขวา = ตั้งค่าชิ้นและพื้นที่ · ลองเล่นได้ทันที'},
 {id:'menu',name:'🎛 ไอคอนเมนู',src:'index.html?editor=menu',note:'เลือกภาพไอคอนให้ปุ่มเมนูขวาบนของเกม'},
 {id:'places',name:'🏠 แผนที่ย่อย',src:'village-place.html?edit=1&place=forge',note:'ตลาด · โรงตีเหล็ก · บ้าน แบบ 2.5D เดินได้ · ลากจุดทำงาน/ของประดับ · ผูกกิจกรรมกับจุดทำงาน · เปลี่ยนภาพ ขนาด พื้น ผนัง · push ขึ้นเกม'}];
const tabs=document.getElementById('tabs'),frames=document.getElementById('frames'),note=document.getElementById('note');let cur=null;
function show(id){let T=TABS.find(t=>t.id===id)||TABS[0];cur=T.id;history.replaceState(null,'','#'+T.id);
 tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===T.id));
 for(let f of frames.children)f.hidden=f.dataset.id!==T.id;
 if(!frames.querySelector(`[data-id="${T.id}"]`)){let f=document.createElement('iframe');f.dataset.id=T.id;f.src=T.src+(T.src.includes('?')?'&':'?')+'build='+encodeURIComponent((window.GAME_VERSION?.v||'')+'-'+Date.now().toString(36));f.title=T.name;frames.appendChild(f)}}
tabs.innerHTML=TABS.map(t=>`<button data-id="${t.id}" title="${t.note.replace(/"/g,'&quot;')} · ค่าที่แก้บันทึกในเบราว์เซอร์นี้ เกมเห็นเมื่อรีโหลด">${t.name}</button>`).join('');
tabs.onclick=e=>{let b=e.target.closest('button');if(b)show(b.dataset.id)};
document.getElementById('reload').onclick=()=>{let f=frames.querySelector(`[data-id="${cur}"]`);if(f)f.src=f.src};
show(TABS.some(t=>t.id===location.hash.slice(1))?location.hash.slice(1):'assets');
/* v91.55 · ⬆ Push of everything staged by Asset Studio / Object Workshop, from any tab (staged files live in IndexedDB, shared by all frames) */
(function(){const sp=document.getElementById('stagedPush'),sd=document.getElementById('stagedDrop');let bc=null;try{bc=new BroadcastChannel('project-a-staged')}catch(e){}
 const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('asset-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 const get=async()=>{try{const db=await idb();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('repo-staged');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}};
 const clear=async()=>{const db=await idb();await new Promise(r=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put([],'repo-staged');t.oncomplete=r;t.onerror=r})};
 const tellFrames=m=>{for(const f of frames.children)try{f.contentWindow.postMessage(m,location.origin)}catch(e){}};
 async function count(){const s=await get(),n=Array.isArray(s)?s.length:0;sp.textContent='⬆ รอ Push ('+n+')';sp.disabled=!n;sd.hidden=!n;sp.dataset.n=n;return n}
 count();if(bc)bc.onmessage=()=>count();setInterval(count,15000);
 sp.onclick=async()=>{const s=await get();if(!Array.isArray(s)||!s.length)return count();if(!GitHubPush.config().token){GitHubPush.openSettings(()=>sp.click());return}
  sp.disabled=true;try{const tag=await GitHubPush.commit('Editor: update images ('+s.length+' files)',async()=>s.map(([p,b])=>b?{path:p,content:b}:{path:p,remove:true}));if(tag){await clear();try{bc&&bc.postMessage(0)}catch(e){}tellFrames({repoStagedPushed:true});alert('push แล้ว · '+tag)}}catch(e){alert('push ไม่สำเร็จ: '+(e.message||e))}finally{count()}};
 sd.onclick=async()=>{const n=+sp.dataset.n||0;if(!confirm('ทิ้งงานที่ยังไม่ push ทั้งหมด ('+n+' ไฟล์)? ย้อนกลับไม่ได้'))return;await clear();try{bc&&bc.postMessage(0)}catch(e){}tellFrames({repoStagedDiscarded:true});count()}})();
window.addEventListener('message',e=>{let d=e.data||{};if(d.editorTab){let f=frames.querySelector(`[data-id="${d.editorTab}"]`);if(f&&d.reload)f.src=f.src;show(d.editorTab)}});
</script>
</body>
</html>
